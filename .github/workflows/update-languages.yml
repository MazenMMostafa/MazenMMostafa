name: Update Language Stats

on:
  schedule:
    - cron: "0 0 * * *"  # Runs every midnight
  workflow_dispatch:  # Allows manual update

jobs:
  update-langs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch Language Stats
        run: |
          curl -H "Authorization: token ${{ secrets.GH_PAT }}" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://github-readme-stats.vercel.app/api/top-langs/?username=MazenMMostafa&layout=pie&count_private=true&theme=dark" \
               -o languages.svg

      - name: Commit & Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add languages.svg
          git commit -m "Updated language stats"
          git push
